  <style>

    body { background: #faf9f5; display: flex; align-items: center; justify-content: center; min-height: 100vh; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
    #__bundler_loading { position: fixed; bottom: 20px; right: 20px; font: 13px/1.4 -apple-system, BlinkMacSystemFont, sans-serif; color: #666; background: #fff; padding: 8px 14px; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,0.12); z-index: 10000; }
    #__bundler_thumbnail { position: fixed; inset: 0; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; background: #faf9f5; z-index: 9999; }

    <style>#__bundler_loading { display: none; }</style>
    <div style="position:fixed;bottom:12px;left:12px;font:13px/1.4 -apple-system,BlinkMacSystemFont,sans-serif;color:#999;background:rgba(255,255,255,0.9);padding:6px 12px;border-radius:6px;box-shadow:0 1px 4px rgba(0,0,0,0.08);z-index:10000;">

<body>
  <div id="__bundler_placeholder">Loading ICF Kitchen Goods — Private-Label Kitchenware Sourcing...</div>
  <div id="__bundler_loading">Unpacking...</div>

  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    // appifacts: only on tags now pointing at OUR blob: URLs. A reference the
    // bundler left live-fetched (an absolute x-import, a runtime dependency it
    // could not embed, an authored external script) keeps the pin it was
    // written with: that fetch is exactly what SRI protects. (A crossorigin
    // on a parent whose child carries the blob — <video crossorigin><source>
    // — is left alone too; the attribute is then the author's to drop.)
    template = template.replace(/<[a-z][^>]*>/gi, (tag) => /\s(?:src|href|srcset|poster|data|xlink:href)="blob:/i.test(tag) ? tag.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '') : tag);

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

l=\"Main\" style=\"display: flex; flex-wrap: wrap; align-items: center; gap: 8px 28px; font-size: 15px; font-weight: 500\">\n<a href=\"#services\" style=\"color: #17242E; text-decoration: none\">Services<\u002Fa>\n<a href=\"#categories\" style=\"color: #17242E; text-decoration: none\">Categories<\u002Fa>\n<a href=\"#process\" style=\"color: #17242E; text-decoration: none\">How it works<\u002Fa>\n<a href=\"#why\" style=\"color: #17242E; text-decoration: none\">Why ICF<\u002Fa>\n<a href=\"#contact\" style=\"display: inline-flex; align-items: center; min-height: 44px; padding: 0 20px; border-radius: 8px; background: {{accent}}; color: #FFFFFF; text-decoration: none; font-weight: 600\">Request a quote<\u002Fa>\n<\u002Fnav>\n<\u002Fdiv>\n<\u002Fheader>\n\n<!-- Hero -->\n<section id=\"top\" style=\"background: #17242E; color: #FFFFFF\">\n<div style=\"max-width: 1200px; margin: 0 auto; padding: 96px 24px; display: flex; flex-wrap: wrap; align-items: center; gap: 56px\">\n<div style=\"flex: 1 1 480px; min-width: 0; display: flex; flex-direction: column; gap: 24px\">\n<p style=\"margin: 0; font-size: 14px; font-weight: 600; letter-spacing: 3px; text-transform: uppercase; color: #E39A72\">Factory-direct · China to USA<\u002Fp>\n<h1 style=\"margin: 0; font-size: clamp(38px, 5vw, 60px); line-height: 1.08; font-weight: 700; letter-spacing: -1.5px\">Your private-label kitchen line, built in our partner factories and delivered to your shelves.<\u002Fh1>\n<p style=\"margin: 0; font-size: 19px; color: #C9D2D9; max-width: 560px\">ICF Kitchen Goods is the sourcing partner between American retailers and the manufacturers behind great kitchenware. We find the factory, develop your product, inspect every run and manage the freight, so you get one partner, one point of contact and one invoice.<\u002Fp>\n<div style=\"display: flex; flex-wrap: wrap; gap: 14px; padding-top: 8px\">\n<a href=\"#contact\" style=\"display: inline-flex; align-items: center; min-height: 52px; padding: 0 28px; border-radius: 8px; background: {{accent}}; color: #FFFFFF; text-decoration: none; font-size: 16px; font-weight: 600\">Start a project<\u002Fa>\n<a href=\"#process\" style=\"display: inline-flex; align-items: center; min-height: 52px; padding: 0 28px; border-radius: 8px; border: 1px solid #4A5B68; color: #FFFFFF; text-decoration: none; font-size: 16px; font-weight: 600\">See how it works<\u002Fa>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"flex: 1 1 380px; min-width: 0; display: flex; justify-content: center\">\n<div style=\"width: 100%; max-width: 440px; background: #FFFFFF; color: #17242E; border-radius: 16px; padding: 28px; box-sizing: border-box; display: flex; flex-direction: column; gap: 20px; box-shadow: 0 24px 60px rgba(0,0,0,0.35)\">\n<div style=\"display: flex; justify-content: space-between; align-items: center; gap: 12px\">\n<span style=\"font-size: 12px; font-weight: 600; letter-spacing: 1.5px; text-transform: uppercase; color: #5B6670\">Example product brief<\u002Fspan>\n<span style=\"font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: 999px; background: #F6E7DE; color: #7E3E20\">In production<\u002Fspan>\n<\u002Fdiv>\n<div style=\"display: flex; flex-direction: column; gap: 4px\">\n<p style=\"margin: 0; font-size: 22px; font-weight: 700; line-height: 1.25\">10\" Tri-Ply Stainless Skillet<\u002Fp>\n<p style=\"margin: 0; font-size: 14px; color: #5B6670\">Your brand · retail gift box · 4-SKU collection<\u002Fp>\n<\u002Fdiv>\n<dl style=\"margin: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px 20px; font-size: 14px\">\n<div><dt style=\"color: #5B6670\">Construction<\u002Fdt><dd style=\"margin: 0; font-weight: 600\">18/10 steel, aluminum core<\u002Fdd><\u002Fdiv>\n<div><dt style=\"color: #5B6670\">Finish<\u002Fdt><dd style=\"margin: 0; font-weight: 600\">Brushed, laser-etched logo<\u002Fdd><\u002Fdiv>\n<div><dt style=\"color: #5B6670\">Testing<\u002Fdt><dd style=\"margin: 0; font-weight: 600\">Food-contact &amp; Prop 65<\u002Fdd><\u002Fdiv>\n<div><dt style=\"color: #5B6670\">Terms<\u002Fdt><dd style=\"margin: 0; font-weight: 600\">FOB Ningbo or DDP<\u002Fdd><\u002Fdiv>\n<\u002Fdl>\n<div style=\"display: flex; flex-direction: column; gap: 10px; border-top: 1px solid #E2E5E8; padding-top: 18px\">\n<div style=\"display: flex; justify-content: space-between; font-size: 13px; font-weight: 600\"><span>Factory matched<\u002Fspan><span style=\"color: #2E6B45\">Done<\u002Fspan><\u002Fdiv>\n<div style=\"display: flex; justify-content: space-between; font-size: 13px; font-weight: 600\"><span>Samples approved<\u002Fspan><span style=\"color: #2E6B45\">Done<\u002Fspan><\u002Fdiv>\n<div style=\"display: flex; justify-content: space-between; font-size: 13px; font-weight: 600\"><span>Production &amp; inspection<\u002Fspan><span style=\"color: #7E3E20\">In progress<\u002Fspan><\u002Fdiv>\n<div style=\"height: 8px; border-radius: 999px; background: #EEF0F2; overflow: hidden\"><div style=\"width: 68%; height: 100%; background: {{accent}}\"><\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<!-- Route strip -->\n<section aria-label=\"Supply route\" style=\"background: #F4F1EC; border-bottom: 1px solid #E5DFD5\">\n<div style=\"max-width: 1200px; margin: 0 auto; padding: 40px 24px; display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 24px\">\n<div style=\"display: flex; flex-direction: column; gap: 4px\">\n<span style=\"font-size: 12px; font-weight: 600; letter-spacing: 2px; text-transform: uppercase; color: #7E3E20\">01 · Make<\u002Fspan>\n<span style=\"font-size: 18px; font-weight: 700\">Vetted factories<\u002Fspan>\n<span style=\"font-size: 14px; color: #4A5661\">Zhejiang and Guangdong manufacturing hubs<\u002Fspan>\n<\u002Fdiv>\n<div style=\"display: flex; flex-direction: column; gap: 4px\">\n<span style=\"font-size: 12px; font-weight: 600; letter-spacing: 2px; text-transform: uppercase; color: #7E3E20\">02 · Inspect<\u002Fspan>\n<span style=\"font-size: 18px; font-weight: 700\">On-site quality checks<\u002Fspan>\n<span style=\"font-size: 14px; color: #4A5661\">Before anything leaves the factory floor<\u002Fspan>\n<\u002Fdiv>\n<div style=\"display: flex; flex-direction: column; gap: 4px\">\n<span style=\"font-size: 12px; font-weight: 600; letter-spacing: 2px; text-transform: uppercase; color: #7E3E20\">03 · Ship<\u002Fspan>\n<span style=\"font-size: 18px; font-weight: 700\">Ningbo &amp; Shenzhen ports<\u002Fspan>\n<span style=\"font-size: 14px; color: #4A5661\">Ocean freight, customs and duties handled<\u002Fspan>\n<\u002Fdiv>\n<div style=\"display: flex; flex-direction: column; gap: 4px\">\n<span style=\"font-size: 12px; font-weight: 600; letter-spacing: 2px; text-transform: uppercase; color: #7E3E20\">04 · Deliver<\u002Fspan>\n<span style=\"font-size: 18px; font-weight: 700\">Your distribution center<\u002Fspan>\n<span style=\"font-size: 14px; color: #4A5661\">Retail-ready, labeled to your routing guide<\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<!-- Services -->\n<section id=\"services\" style=\"padding: 104px 0\">\n<div style=\"max-width: 1200px; margin: 0 auto; padding: 0 24px; display: flex; flex-direction: column; gap: 48px\">\n<div style=\"display: flex; flex-direction: column; gap: 14px; max-width: 720px\">\n<p style=\"margin: 0; font-size: 14px; font-weight: 600; letter-spacing: 3px; text-transform: uppercase; color: #7E3E20\">What we do<\u002Fp>\n<h2 style=\"margin: 0; font-size: clamp(30px, 3.6vw, 44px); line-height: 1.15; letter-spacing: -1px\">Everything between your idea and a pallet at your dock.<\u002Fh2>\n<p style=\"margin: 0; font-size: 18px; color: #4A5661\">Your buyers set the product and the price point. We handle the parts that usually take a sourcing team, a QC firm and a freight forwarder.<\u002Fp>\n<\u002Fdiv>\n<div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px\">\n<article style=\"border: 1px solid #E2E5E8; border-radius: 14px; padding: 28px; display: flex; flex-direction: column; gap: 12px\">\n<svg aria-hidden=\"true\" width=\"32\" height=\"32\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#A4532C\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M3 21V9l6 4V9l6 4V5h6v16z\"><\u002Fpath><path d=\"M7 17h2M12 17h2M17 17h1\"><\u002Fpath><\u002Fsvg>\n<h3 style=\"margin: 0; font-size: 20px\">Factory sourcing<\u002Fh3>\n<p style=\"margin: 0; font-size: 15px; color: #4A5661\">We match each product to a manufacturer that already makes it well, then audit capacity, certifications and working conditions before you commit.<\u002Fp>\n<\u002Farticle>\n<article style=\"border: 1px solid #E2E5E8; border-radius: 14px; padding: 28px; display: flex; flex-direction: column; gap: 12px\">\n<svg aria-hidden=\"true\" width=\"32\" height=\"32\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#A4532C\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M20.6 13.4 13.4 20.6a2 2 0 0 1-2.8 0L3 13V3h10l7.6 7.6a2 2 0 0 1 0 2.8z\"><\u002Fpath><circle cx=\"7.5\" cy=\"7.5\" r=\"1.5\"><\u002Fcircle><\u002Fsvg>\n<h3 style=\"margin: 0; font-size: 20px\">Private-label development<\u002Fh3>\n<p style=\"margin: 0; font-size: 15px; color: #4A5661\">Logo application, colorways, inserts and retail packaging designed to your brand standards, with dielines and artwork managed end to end.<\u002Fp>\n<\u002Farticle>\n<article style=\"border: 1px solid #E2E5E8; border-radius: 14px; padding: 28px; display: flex; flex-direction: column; gap: 12px\">\n<svg aria-hidden=\"true\" width=\"32\" height=\"32\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#A4532C\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M21 8 12 3 3 8v8l9 5 9-5z\"><\u002Fpath><path d=\"M3 8l9 5 9-5M12 13v8\"><\u002Fpath><\u002Fsvg>\n<h3 style=\"margin: 0; font-size: 20px\">Sampling &amp; approvals<\u002Fh3>\n<p style=\"margin: 0; font-size: 15px; color: #4A5661\">Pre-production samples shipped to your office for review. We track revisions until every detail matches the approved golden sample.<\u002Fp>\n<\u002Farticle>\n<article style=\"border: 1px solid #E2E5E8; border-radius: 14px; padding: 28px; display: flex; flex-direction: column; gap: 12px\">\n<svg aria-hidden=\"true\" width=\"32\" height=\"32\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#A4532C\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"11\" cy=\"11\" r=\"7\"><\u002Fcircle><path d=\"m20 20-4-4M8 11l2 2 4-4\"><\u002Fpath><\u002Fsvg>\n<h3 style=\"margin: 0; font-size: 20px\">Quality control<\u002Fh3>\n<p style=\"margin: 0; font-size: 15px; color: #4A5661\">In-line and pre-shipment inspections to AQL standards, with photo reports sent to you before a container is booked.<\u002Fp>\n<\u002Farticle>\n<article style=\"border: 1px solid #E2E5E8; border-radius: 14px; padding: 28px; display: flex; flex-direction: column; gap: 12px\">\n<svg aria-hidden=\"true\" width=\"32\" height=\"32\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#A4532C\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 3 4 6v6c0 5 3.5 8 8 9 4.5-1 8-4 8-9V6z\"><\u002Fpath><path d=\"m9 12 2 2 4-4\"><\u002Fpath><\u002Fsvg>\n<h3 style=\"margin: 0; font-size: 20px\">Compliance testing<\u002Fh3>\n<p style=\"margin: 0; font-size: 15px; color: #4A5661\">We coordinate third-party lab testing for FDA food-contact, California Prop 65 and your retailer's own vendor requirements.<\u002Fp>\n<\u002Farticle>\n<article style=\"border: 1px solid #E2E5E8; border-radius: 14px; padding: 28px; display: flex; flex-direction: column; gap: 12px\">\n<svg aria-hidden=\"true\" width=\"32\" height=\"32\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#A4532C\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M2 17h20l-2 4H4z\"><\u002Fpath><path d=\"M5 17V9h6v8M11 12h6v5M8 9V5\"><\u002Fpath><\u002Fsvg>\n<h3 style=\"margin: 0; font-size: 20px\">Freight &amp; landed cost<\u002Fh3>\n<p style=\"margin: 0; font-size: 15px; color: #4A5661\">FOB or fully landed DDP pricing, with ocean freight, customs brokerage and duties built into one quote you can plan around.<\u002Fp>\n<\u002Farticle>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<!-- Categories -->\n<section id=\"categories\" style=\"padding: 104px 0; background: #F4F1EC\">\n<div style=\"max-width: 1200px; margin: 0 auto; padding: 0 24px; display: flex; flex-direction: column; gap: 48px\">\n<div style=\"display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 24px\">\n<div style=\"display: flex; flex-direction: column; gap: 14px; max-width: 640px\">\n<p style=\"margin: 0; font-size: 14px; font-weight: 600; letter-spacing: 3px; text-transform: uppercase; color: #7E3E20\">Categories<\u002Fp>\n<h2 style=\"margin: 0; font-size: clamp(30px, 3.6vw, 44px); line-height: 1.15; letter-spacing: -1px\">Kitchen and home, from the stovetop to the table.<\u002Fh2>\n<\u002Fdiv>\n<p style=\"margin: 0; font-size: 16px; color: #4A5661; max-width: 360px\">Don't see your category? If it lives in a kitchen, we can likely source it.<\u002Fp>\n<\u002Fdiv>\n<div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px\">\n<div style=\"background: #FFFFFF; border-radius: 14px; padding: 28px; display: flex; flex-direction: column; gap: 10px; min-height: 170px; box-sizing: border-box\">\n<span style=\"font-size: 14px; font-weight: 700; color: #7E3E20\">01<\u002Fspan>\n<h3 style=\"margin: 0; font-size: 22px\">Cookware<\u002Fh3>\n<p style=\"margin: 0; font-size: 15px; color: #4A5661\">Stainless, nonstick, cast iron and enameled pots, pans and sets.<\u002Fp>\n<\u002Fdiv>\n<div style=\"background: #FFFFFF; border-radius: 14px; padding: 28px; display: flex; flex-direction: column; gap: 10px; min-height: 170px; box-sizing: border-box\">\n<span style=\"font-size: 14px; font-weight: 700; color: #7E3E20\">02<\u002Fspan>\n<h3 style=\"margin: 0; font-size: 22px\">Bakeware<\u002Fh3>\n<p style=\"margin: 0; font-size: 15px; color: #4A5661\">Sheet pans, cake and muffin tins, glass and silicone baking dishes.<\u002Fp>\n<\u002Fdiv>\n<div style=\"background: #FFFFFF; border-radius: 14px; padding: 28px; display: flex; flex-direction: column; gap: 10px; min-height: 170px; box-sizing: border-box\">\n<span style=\"font-size: 14px; font-weight: 700; color: #7E3E20\">03<\u002Fspan>\n<h3 style=\"margin: 0; font-size: 22px\">Tools &amp; gadgets<\u002Fh3>\n<p style=\"margin: 0; font-size: 15px; color: #4A5661\">Utensil sets, peelers, graters, measuring tools and prep essentials.<\u002Fp>\n<\u002Fdiv>\n<div style=\"background: #FFFFFF; border-radius: 14px; padding: 28px; display: flex; flex-direction: column; gap: 10px; min-height: 170px; box-sizing: border-box\">\n<span style=\"font-size: 14px; font-weight: 700; color: #7E3E20\">04<\u002Fspan>\n<h3 style=\"margin: 0; font-size: 22px\">Food storage<\u002Fh3>\n<p style=\"margin: 0; font-size: 15px; color: #4A5661\">Glass and BPA-free containers, canisters, jars and lunch sets.<\u002Fp>\n<\u002Fdiv>\n<div style=\"background: #FFFFFF; border-radius: 14px; padding: 28px; display: flex; flex-direction: column; gap: 10px; min-height: 170px; box-sizing: border-box\">\n<span style=\"font-size: 14px; font-weight: 700; color: #7E3E20\">05<\u002Fspan>\n<h3 style=\"margin: 0; font-size: 22px\">Cutlery<\u002Fh3>\n<p style=\"margin: 0; font-size: 15px; color: #4A5661\">Knife blocks, chef's knives, steak sets and cutting boards.<\u002Fp>\n<\u002Fdiv>\n<div style=\"background: #FFFFFF; border-radius: 14px; padding: 28px; display: flex; flex-direction: column; gap: 10px; min-height: 170px; box-sizing: border-box\">\n<span style=\"font-size: 14px; font-weight: 700; color: #7E3E20\">06<\u002Fspan>\n<h3 style=\"margin: 0; font-size: 22px\">Tabletop &amp; drinkware<\u002Fh3>\n<p style=\"margin: 0; font-size: 15px; color: #4A5661\">Dinnerware, flatware, glassware and insulated tumblers.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<!-- Process -->\n<section id=\"process\" style=\"padding: 104px 0\">\n<div style=\"max-width: 1200px; margin: 0 auto; padding: 0 24px; display: flex; flex-direction: column; gap: 48px\">\n<div style=\"display: flex; flex-direction: column; gap: 14px; max-width: 720px\">\n<p style=\"margin: 0; font-size: 14px; font-weight: 600; letter-spacing: 3px; text-transform: uppercase; color: #7E3E20\">How it works<\u002Fp>\n<h2 style=\"margin: 0; font-size: clamp(30px, 3.6vw, 44px); line-height: 1.15; letter-spacing: -1px\">Five steps from brief to delivery.<\u002Fh2>\n<\u002Fdiv>\n<ol style=\"margin: 0; padding: 0; list-style: none; display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px\">\n<li style=\"display: flex; flex-direction: column; gap: 12px; border-top: 3px solid {{accent}}; padding-top: 20px\">\n<span style=\"font-size: 32px; font-weight: 700; color: #17242E\">1<\u002Fspan>\n<h3 style=\"margin: 0; font-size: 18px\">Share your brief<\u002Fh3>\n<p style=\"margin: 0; font-size: 15px; color: #4A5661\">Target retail price, volumes, timeline and any reference products.<\u002Fp>\n<\u002Fli>\n<li style=\"display: flex; flex-direction: column; gap: 12px; border-top: 3px solid {{accent}}; padding-top: 20px\">\n<span style=\"font-size: 32px; font-weight: 700; color: #17242E\">2<\u002Fspan>\n<h3 style=\"margin: 0; font-size: 18px\">Factory match &amp; quote<\u002Fh3>\n<p style=\"margin: 0; font-size: 15px; color: #4A5661\">We shortlist manufacturers and return pricing, MOQs and lead times.<\u002Fp>\n<\u002Fli>\n<li style=\"display: flex; flex-direction: column; gap: 12px; border-top: 3px solid {{accent}}; padding-top: 20px\">\n<span style=\"font-size: 32px; font-weight: 700; color: #17242E\">3<\u002Fspan>\n<h3 style=\"margin: 0; font-size: 18px\">Samples &amp; branding<\u002Fh3>\n<p style=\"margin: 0; font-size: 15px; color: #4A5661\">Samples land on your desk, and packaging is finalized with your team.<\u002Fp>\n<\u002Fli>\n<li style=\"display: flex; flex-direction: column; gap: 12px; border-top: 3px solid {{accent}}; padding-top: 20px\">\n<span style=\"font-size: 32px; font-weight: 700; color: #17242E\">4<\u002Fspan>\n<h3 style=\"margin: 0; font-size: 18px\">Production &amp; QC<\u002Fh3>\n<p style=\"margin: 0; font-size: 15px; color: #4A5661\">We are on the floor during the run and inspect before shipment.<\u002Fp>\n<\u002Fli>\n<li style=\"display: flex; flex-direction: column; gap: 12px; border-top: 3px solid {{accent}}; padding-top: 20px\">\n<span style=\"font-size: 32px; font-weight: 700; color: #17242E\">5<\u002Fspan>\n<h3 style=\"margin: 0; font-size: 18px\">Delivered to you<\u002Fh3>\n<p style=\"margin: 0; font-size: 15px; color: #4A5661\">Freight, customs and duties handled, straight to your DC.<\u002Fp>\n<\u002Fli>\n<\u002Fol>\n<\u002Fdiv>\n<\u002Fsection>\n\n<!-- Why ICF -->\n<section id=\"why\" style=\"padding: 104px 0; background: #17242E; color: #FFFFFF\">\n<div style=\"max-width: 1200px; margin: 0 auto; padding: 0 24px; display: flex; flex-direction: column; gap: 48px\">\n<div style=\"display: flex; flex-direction: column; gap: 14px; max-width: 720px\">\n<p style=\"margin: 0; font-size: 14px; font-weight: 600; letter-spacing: 3px; text-transform: uppercase; color: #E39A72\">Why a sourcing partner<\u002Fp>\n<h2 style=\"margin: 0; font-size: clamp(30px, 3.6vw, 44px); line-height: 1.15; letter-spacing: -1px\">Going direct is cheaper on paper. We make it cheaper in practice.<\u002Fh2>\n<\u002Fdiv>\n<div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 20px\">\n<div style=\"border: 1px solid #3A4A57; border-radius: 14px; padding: 32px; display: flex; flex-direction: column; gap: 18px\">\n<h3 style=\"margin: 0; font-size: 20px; color: #C9D2D9\">Sourcing on your own<\u002Fh3>\n<ul style=\"margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 12px; font-size: 16px; color: #C9D2D9\">\n<li>Dozens of supplier calls across time zones and languages<\u002Fli>\n<li>Separate vendors for QC, testing, freight and customs<\u002Fli>\n<li>Quality problems discovered after the container arrives<\u002Fli>\n<li>Landed cost you only learn once the invoices stack up<\u002Fli>\n<\u002Ful>\n<\u002Fdiv>\n<div style=\"background: #FFFFFF; color: #17242E; border-radius: 14px; padding: 32px; display: flex; flex-direction: column; gap: 18px\">\n<h3 style=\"margin: 0; font-size: 20px\">With ICF Kitchen Goods<\u002Fh3>\n<ul style=\"margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 12px; font-size: 16px; color: #2D3A44\">\n<li>One US-based contact who speaks to the factory for you<\u002Fli>\n<li>Sourcing, QC, testing and freight under one agreement<\u002Fli>\n<li>Problems caught on the factory floor, not at your dock<\u002Fli>\n<li>A fully landed price per unit, quoted up front<\u002Fli>\n<\u002Ful>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<!-- Contact -->\n<section id=\"contact\" style=\"padding: 104px 0\">\n<div style=\"max-width: 1200px; margin: 0 auto; padding: 0 24px; display: flex; flex-wrap: wrap; gap: 56px\">\n<div style=\"flex: 1 1 360px; min-width: 0; display: flex; flex-direction: column; gap: 20px\">\n<p style=\"margin: 0; font-size: 14px; font-weight: 600; letter-spacing: 3px; text-transform: uppercase; color: #7E3E20\">Start a project<\u002Fp>\n<h2 style=\"margin: 0; font-size: clamp(30px, 3.6vw, 44px); line-height: 1.15; letter-spacing: -1px\">Tell us what you want on the shelf.<\u002Fh2>\n<p style=\"margin: 0; font-size: 18px; color: #4A5661\">Send a product idea, a competitor's item or a full spec sheet. We'll reply with factory options and a landed-cost estimate.<\u002Fp>\n<div style=\"display: flex; flex-direction: column; gap: 10px; padding-top: 8px; font-size: 16px\">\n<a href=\"mailto:racejgrinder@gmail.com\" style=\"font-weight: 600\">racejgrinder@gmail.com<\u002Fa>\n<a href=\"tel:+15135083238\" style=\"font-weight: 600\">+1 513 508 3238<\u002Fa>\n<span style=\"color: #4A5661\">WhatsApp and WeChat available<\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n<form aria-label=\"Quote request\" style=\"flex: 1 1 480px; min-width: 0; border: 1px solid #E2E5E8; border-radius: 16px; padding: 32px; box-sizing: border-box; display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 18px\">\n<div style=\"display: flex; flex-direction: column; gap: 6px\">\n<label for=\"q-name\" style=\"font-size: 14px; font-weight: 600\">Name<\u002Flabel>\n<input id=\"q-name\" type=\"text\" autocomplete=\"name\" style=\"min-height: 46px; padding: 0 14px; border: 1px solid #C3C9CE; border-radius: 8px; font: inherit; font-size: 15px\">\n<\u002Fdiv>\n<div style=\"display: flex; flex-direction: column; gap: 6px\">\n<label for=\"q-company\" style=\"font-size: 14px; font-weight: 600\">Company<\u002Flabel>\n<input id=\"q-company\" type=\"text\" autocomplete=\"organization\" style=\"min-height: 46px; padding: 0 14px; border: 1px solid #C3C9CE; border-radius: 8px; font: inherit; font-size: 15px\">\n<\u002Fdiv>\n<div style=\"display: flex; flex-direction: column; gap: 6px\">\n<label for=\"q-email\" style=\"font-size: 14px; font-weight: 600\">Work email<\u002Flabel>\n<input id=\"q-email\" type=\"email\" autocomplete=\"email\" style=\"min-height: 46px; padding: 0 14px; border: 1px solid #C3C9CE; border-radius: 8px; font: inherit; font-size: 15px\">\n<\u002Fdiv>\n<div style=\"display: flex; flex-direction: column; gap: 6px\">\n<label for=\"q-cat\" style=\"font-size: 14px; font-weight: 600\">Category<\u002Flabel>\n<sc-raw-select id=\"q-cat\" style=\"min-height: 46px; padding: 0 12px; border: 1px solid #C3C9CE; border-radius: 8px; font: inherit; font-size: 15px; background: #FFFFFF\">\n<option>Cookware<\u002Foption>\n<option>Bakeware<\u002Foption>\n<option>Tools &amp; gadgets<\u002 ont-weight: 500\">\n<a href=\"#services\" style=\"color: #17242E; text-decoration: none\">Services<\u002Fa>\n<a href=\"#categories\" style=\"color: #17242E; text-decoration: none\">Categories<\u002Fa>\n<a href=\"#process\" style=\"color: #17242E; text-decoration: none\">How it works<\u002Fa>\n<a href=\"#why\" style=\"color: #17242E; text-decoration: none\">Why ICF<\u002Fa>\n<a href=\"#contact\" style=\"display: inline-flex; align-items: center; min-height: 44px; padding: 0 20px; border-radius: 8px; background: #A4532C; color: #FFFFFF; text-decoration: none; font-weight: 600\">Request a quote<\u002Fa>\n<\u002Fnav>\n<\u002Fdiv>\n<\u002Fheader>\n\n\n<section id=\"top\" style=\"background: #17242E; color: #FFFFFF\">\n<div style=\"max-width: 1200px; margin: 0 auto; padding: 96px 24px; display: flex; flex-wrap: wrap; align-items: center; gap: 56px\">\n<div style=\"flex: 1 1 480px; min-width: 0; display: flex; flex-direction: column; gap: 24px\">\n<p style=\"margin: 0; font-size: 14px; font-weight: 600; letter-spacing: 3px; text-transform: uppercase; color: #E39A72\">Factory-direct · China to USA<\u002Fp>\n<h1 style=\"margin: 0; font-size: clamp(38px, 5vw, 60px); line-height: 1.08; font-weight: 700; letter-spacing: -1.5px\">Your private-label kitchen line, built in our partner factories and delivered to your shelves.<\u002Fh1>\n<p style=\"margin: 0; font-size: 19px; color: #C9D2D9; max-width: 560px\">ICF Kitchen Goods is the sourcing partner between American retailers and the manufacturers behind great kitchenware. We find the factory, develop your product, inspect every run and manage the freight, so you get one partner, one point of contact and one invoice.<\u002Fp>\n<div style=\"display: flex; flex-wrap: wrap; gap: 14px; padding-top: 8px\">\n<a href=\"#contact\" style=\"display: inline-flex; align-items: center; min-height: 52px; padding: 0 28px; border-radius: 8px; background: #A4532C; color: #FFFFFF; text-decoration: none; font-size: 16px; font-weight: 600\">Start a p gbo or DDP<\u002Fdd><\u002Fdiv>\n<\u002Fdl>\n<div style=\"display: flex; flex-direction: column; gap: 10px; border-top: 1px solid #E2E5E8; padding-top: 18px\">\n<div style=\"display: flex; justify-content: space-between; font-size: 13px; font-weight: 600\"><span>Factory matched<\u002Fspan><span style=\"color: #2E6B45\">Done<\u002Fspan><\u002Fdiv>\n<div style=\"display: flex; justify-content: space-between; font-size: 13px; font-weight: 600\"><span>Samples approved<\u002Fspan><span style=\"color: #2E6B45\">Done<\u002Fspan><\u002Fdiv>\n<div style=\"display: flex; justify-content: space-between; font-size: 13px; font-weight: 600\"><span>Production &amp; inspection<\u002Fspan><span style=\"color: #7E3E20\">In progress<\u002Fspan><\u002Fdiv>\n<div style=\"height: 8px; border-radius: 999px; background: #EEF0F2; overflow: hidden\"><div style=\"width: 68%; height: 100%; background: #A4532C\"><\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n\n<section aria-label=\"Supply route\" style=\"background: #F4F1EC; border-bottom: 1px solid #E5DFD5\">\n<div style=\"max-width: 1200px; margin: 0 auto; padding: 40px 24px; display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 24px\">\n<div style=\"display: flex; flex-direction: column; gap: 4px\">\n<span style=\"font-size: 12px; font-weight: 600; letter-spacing: 2px; text-transform: uppercase; color: #7E3E20\">01 · Make<\u002Fspan>\n<span style=\"font-size: 18px; font-weight: 700\">Vetted factories<\u002Fspan>\n<span style=\"font-size: 14px; color: #4A5661\">Zhejiang and Guangdong manufacturing hubs<\u002Fspan>\n<\u002Fdiv>\n<div style=\"display: flex; flex-direction: column; gap: 4px\">\n<span style=\"font-size: 12px; font-weight: 600; letter-spacing: 2px; text-transform: uppercase; color: #7E3E20\">02 · Inspect<\u002Fspan>\n<span style=\"font-size: 18px; font-weight: 700\">On-site quality checks<\u002Fspan>\n<span style=\"font-size: 14px; color: #4A5661\">Before anything leaves the factory floor<\u002Fspan>\n<\u002Fdiv>\n<div style=\"display: flex; flex-direction: column; gap: 4px\">\n<span style=\"font-size: 12px; font-weight: 600; letter-spacing: 2px; text-transform: uppercase; color: #7E3E20\">03 · Ship<\u002Fspan>\n<span style=\"font-size: 18px; font-weight: 700\">Ningbo &amp; Shenzhen ports<\u002Fspan>\n<span style=\"font-size: 14px; color: #4A5661\">Ocean freight, customs and duties handled<\u002Fspan>\n<\u002Fdiv>\n<div style=\"display: flex; flex-direction: column; gap: 4px\">\n<span style=\"font-size: 12px; font-weight: 600; letter-spacing: 2px; text-transform: uppercase; color: #7E3E20\">04 · Deliver<\u002Fspan>\n<span style=\"font-size: 18px; font-weight: 700\">Your distribution center<\u002Fspan>\n<span style=\"font-size: 14px; color: #4A5661\">Retail-ready, labeled to your routing guide<\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n\n<section id=\"services\" style=\"padding: 104px 0\">\n<div style=\"max-width: 1200px; margin: 0 auto; padding: 0 24px; display: flex; flex-direction: column; gap: 48px\">\n<div style=\"display: flex; flex-direction: column; gap: 14px; max-width: 720px\">\n<p style=\"margin: 0; font-size: 14px; font-weight: 600; letter-spacing: 3px; text-transform: uppercase; color: #7E3E20\">What we do<\u002Fp>\n<h2 style=\"margin: 0; font-size: clamp(30px, 3.6vw, 44px); line-height: 1.15; letter-spacing: -1px\">Everything between your idea and a pallet at your dock.<\u002Fh2>\n<p style=\"margin: 0; font-size: 18px; color: #4A5661\">Your buyers set the product and the price point. We handle the parts that usually take a sourcing team, a QC firm and a freight forwarder.<\u002Fp>\n<\u002Fdiv>\n<div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px\">\n<article style=\"border: 1px solid #E2E5E8; border-radius: 14px; padding: 28px; display: flex; flex-direction: column; gap: 12px\">\n<svg aria-hidden=\"true\" width=\"32\" height=\"32\" viewBox=\"0 2Farticle>\n<article style=\"border: 1px solid #E2E5E8; border-radius: 14px; padding: 28px; display: flex; flex-direction: column; gap: 12px\">\n<svg aria-hidden=\"true\" width=\"32\" height=\"32\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#A4532C\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"11\" cy=\"11\" r=\"7\"><\u002Fcircle><path d=\"m20 20-4-4M8 11l2 2 4-4\"><\u002Fpath><\u002Fsvg>\n<h3 style=\"margin: 0; font-size: 20px\">Quality control<\u002Fh3>\n<p style=\"margin: 0; font-size: 15px; color: #4A5661\">In-line and pre-shipment inspections to AQL standards, with photo reports sent to you before a container is booked.<\u002Fp>\n<\u002Farticle>\n<article style=\"border: 1px solid #E2E5E8; border-radius: 14px; padding: 28px; display: flex; flex-direction: column; gap: 12px\">\n<svg aria-hidden=\"true\" width=\"32\" height=\"32\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#A4532C\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 3 4 6v6c0 5 3.5 8 8 9 4.5-1 8-4 8-9V6z\"><\u002Fpath><path d=\"m9 12 2 2 4-4\"><\u002Fpath><\u002Fsvg>\n<h3 style=\"margin: 0; font-size: 20px\">Compliance testing<\u002Fh3>\n<p style=\"margin: 0; font-size: 15px; color: #4A5661\">We coordinate third-party lab testing for FDA food-contact, California Prop 65 and your retailer's own vendor requirements.<\u002Fp>\n<\u002Farticle>\n<article style=\"border: 1px solid #E2E5E8; border-radius: 14px; padding: 28px; display: flex; flex-direction: column; gap: 12px\">\n<svg aria-hidden=\"true\" width=\"32\" height=\"32\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#A4532C\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M2 17h20l-2 4H4z\"><\u002Fpath><path d=\"M5 17V9h6v8M11 12h6v5M8 9V5\"><\u002Fpath><\u002Fsvg>\n<h3 style=\"margin: 0; font-size: 20px\">Freight &amp; landed cost<\u002Fh3>\n<p style=\"margin: 0; font-size: 15px; color: #4A5661\">FOB or fully landed DDP pricing, with ocean freight, customs brokerage and duties built into one quote you can plan around.<\u002Fp>\n<\u002Farticle>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n\n<section id=\"categories\" style=\"padding: 104px 0; background: #F4F1EC\">\n<div style=\"max-width: 1200px; margin: 0 auto; padding: 0 24px; display: flex; flex-direction: column; gap: 48px\">\n<div style=\"display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 24px\">\n<div style=\"display: flex; flex-direction: column; gap: 14px; max-width: 640px\">\n<p style=\"margin: 0; font-size: 14px; font-weight: 600; letter-spacing: 3px; text-transform: uppercase; color: #7E3E20\">Categories<\u002Fp>\n<h2 style=\"margin: 0; font-size: clamp(30px, 3.6vw, 44px); line-height: 1.15; letter-spacing: -1px\">Kitchen and home, from the stovetop to the table.<\u002Fh2>\n<\u002Fdiv>\n<p style=\"margin: 0; font-size: 16px; color: #4A5661; max-width: 360px\">Don't see your category? If it lives in a kitchen, we can likely source it.<\u002Fp>\n<\u002Fdiv>\n<div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px\">\n<div style=\"background: #FFFFFF; border-radius: 14px; padding: 28px; display: flex; flex-direction: column; gap: 10px; min-height: 170px; box-sizing: border-box\">\n<span style=\"font-size: 14px; font-weight: 700; color: #7E3E20\">01<\u002Fspan>\n<h3 style=\"margin: 0; font-size: 22px\">Cookware<\u002Fh3>\n<p style=\"margin: 0; font-size: 15px; color: #4A5661\">Stainless, nonstick, cast iron and enameled pots, pans and sets.<\u002Fp>\n<\u002Fdiv>\n<div style=\"background: #FFFFFF; border-radius: 14px; padding: 28px; display: flex; flex-direction: column; gap: 10px; min-height: 170px; box-sizing: border-box\">\n<span style=\"font-size: 14px; font-weight: 700; color: #7E3E20\">02<\u002Fspan>\n<h3 style=\"margin: 0; font-size: 22px\">Bakeware<\u002Fh3>\n<p style=\"margin: 0; font-size: 15px; color: #4A5661\">Sheet pans, cake and muffin tins, glass and silicone baking dishes.<\u002Fp>\n<\u002Fdiv>\n<div style=\"background: #FFFFFF; border-radius: 14px; padding: 28px; display: flex; flex-direction: column; gap: 10px; min-height: 170px; box-sizing: border-box\">\n<span style=\"font-size: 14px; font-weight: 700; color: #7E3E20\">03<\u002Fspan>\n<h3 style=\"margin: 0; font-size: 22px\">Tools &amp; gadgets<\u002Fh3>\n<p style=\"margin: 0; font-size: 15px; color: #4A5661\">Utensil sets, peelers, graters, measuring tools and prep essentials.<\u002Fp>\n<\u002Fdiv>\n<div style=\"background: #FFFFFF; border-radius: 14px; padding: 28px; display: flex; flex-direction: column; gap: 10px; min-height: 170px; box-sizing: border-box\">\n<span style=\"font-size: 14px; font-weight: 700; color: #7E3E20\">04<\u002Fspan>\n<h3 style=\"margin: 0; font-size: 22px\">Food storage<\u002Fh3>\n<p style=\"margin: 0; font-size: 15px; color: #4A5661\">Glass and BPA-free containers, canisters, jars and lunch sets.<\u002Fp>\n<\u002Fdiv>\n<div style=\"background: #FFFFFF; border-radius: 14px; padding: 28px; display: flex; flex-direction: column; gap: 10px; min-height: 170px; box-sizing: border-box\">\n<span style=\"font-size: 14px; font-weight: 700; color: #7E3E20\">05<\u002Fspan>\n<h3 style=\"margin: 0; font-size: 22px\">Cutlery<\u002Fh3>\n<p style=\"margin: 0; font-size: 15px; color: #4A5661\">Knife blocks, chef's knives, steak sets and cutting boards.<\u002Fp>\n<\u002Fdiv>\n<div style=\"background: #FFFFFF; border-radius: 14px; padding: 28px; display: flex; flex-direction: column; gap: 10px; min-height: 170px; box-sizing: border-box\">\n<span style=\"font-size: 14px; font-weight: 700; color: #7E3E20\">06<\u002Fspan>\n<h3 style=\"margin: 0; font-size: 22px\">Tabletop &amp; drinkware<\u002Fh3>\n<p style=\"margin: 0; font-size: 15px; color: #4A5661\">Dinnerware, flatware, glassware and insulated tumblers.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n\n<section id=\"process\" style=\"padding: 104px 0\">\n<div style=\"max-width: 1200px; margin: 0 auto; padding: 0 24px; display: flex; flex-direction: column; gap: 48px\">\n<div style=\"display: flex; flex-direction: column; gap: 14px; max-width: 720px\">\n<p style=\"margin: 0; font-size: 14px; font-weight: 600; letter-spacing: 3px; text-transform: uppercase; color: #7E3E20\">How it works<\u002Fp>\n<h2 style=\"margin: 0; font-size: clamp(30px, 3.6vw, 44px); line-height: 1.15; letter-spacing: -1px\">Five steps from brief to delivery.<\u002Fh2>\n<\u002Fdiv>\n<ol style=\"margin: 0; padding: 0; list-style: none; display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px\">\n<li style=\"display: flex; flex-direction: column; gap: 12px; border-top: 3px solid #A4532C; padding-top: 20px\">\n<span style=\"font-size: 32px; font-weight: 700; color: #17242E\">1<\u002Fspan>\n<h3 style=\"margin: 0; font-size: 18px\">Share your brief<\u002Fh3>\n<p style=\"margin: 0; font-size: 15px; color: #4A5661\">Target retail price, volumes, timeline and any reference products.<\u002Fp>\n<\u002Fli>\n<li style=\"display: flex; flex-direction: column; gap: 12px; border-top: 3px solid #A4532C; padding-top: 20px\">\n<span style=\"font-size: 32px; font-weight: 700; color: #17242E\">2<\u002Fspan>\n<h3 style=\"margin: 0; font-size: 18px\">Factory match &amp; quote<\u002Fh3>\n<p style=\"margin: 0; font-size: 15px; color: #4A5661\">We shortlist manufacturers and return pricing, MOQs and lead times.<\u002Fp>\n<\u002Fli>\n<li style=\"display: flex; flex-direction: column; gap: 12px; border-top: 3px solid #A4532C; padding-top: 20px\">\n<span style=\"font-size: 32px; font-weight: 700; color: #17242E\">3<\u002Fspan>\n<h3 style=\"margin: 0; font-size: 18px\">Samples &amp; branding<\u002Fh3>\n<p style=\"margin: 0; font-size: 15px; color: #4A5661\">Samples land on your desk, and packaging is finalized with your team.<\u002Fp>\n<\u002Fli>\n<li style=\"display: flex; flex-direction: column; gap: 12px; border-top: 3px solid #A4532C; padding-top: 20px\">\n<span style=\"font-size: 32px; font-weight: 700; color: #17242E\">4<\u002Fspan>\n<h3 style=\"margin: 0; font-size: 18px\">Production &amp; QC<\u002Fh3>\n<p style=\"margin: 0; font-size: 15px; color: #4A5661\">We are on the floor during the run and inspect before shipment.<\u002Fp>\n<\u002Fli>\n<li style=\"display: flex; flex-direction: column; gap: 12px; border-top: 3px solid #A4532C; padding-top: 20px\">\n<span style=\"font-size: 32px; font-weight: 700; color: #17242E\">5<\u002Fspan>\n<h3 style=\"margin: 0; font-size: 18px\">Delivered to you<\u002Fh3>\n<p style=\"margin: 0; font-size: 15px; color: #4A5661\">Freight, customs and duties handled, straight to your DC.<\u002Fp>\n<\u002Fli>\n<\u002Fol>\n<\u002Fdiv>\n<\u002Fsection>\n\n\n<section id=\"why\" style=\"padding: 104px 0; background: #17242E; color: #FFFFFF\">\n<div style=\"max-width: 1200px; margin: 0 auto; padding: 0 24px; display: flex; flex-direction: column; gap: 48px\">\n<div style=\"display: flex; flex-direction: column; gap: 14px; max-width: 720px\">\n<p style=\"margin: 0; font-size: 14px; font-weight: 600; letter-spacing: 3px; text-transform: uppercase; color: #E39A72\">Why a sourcing partner<\u002Fp>\n<h2 style=\"margin: 0; font-size: clamp(30px, 3.6vw, 44px); line-height: 1.15; letter-spacing: -1px\">Going direct is cheaper on paper. We make it cheaper in practice.<\u002Fh2>\n<\u002Fdiv>\n<div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 20px\">\n<div style=\"border: 1px solid #3A4A57; border-radius: 14px; padding: 32px; display: flex; flex-direction: column; gap: 18px\">\n<h3 style=\"margin: 0; font-size: 20px; color: #C9D2D9\">Sourcing on your own<\u002Fh3>\n<ul style=\"margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 12px; font-size: 16px; color: #C9D2D9\">\n<li>Dozens of supplier calls across time zones and languages<\u002Fli>\n<li>Separate vendors for QC, testing, freight and customs<\u002Fli>\n<li>Quality problems discovered after the container arrives<\u002Fli>\n<li>Landed cost you only learn once the invoices stack up<\u002Fli>\n<\u002Ful>\n<\u002Fdiv>\n<div style=\"background: #FFFFFF; color: #17242E; border-radius: 14px; padding: 32px; display: flex; flex-direction: column; gap: 18px\">\n<h3 style=\"margin: 0; font-size: 20px\">With ICF Kitchen Goods<\u002Fh3>\n<ul style=\"margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 12px; font-size: 16px; color: #2D3A44\">\n<li>One US-based contact who speaks to the factory for you<\u002Fli>\n<li>Sourcing, QC, testing and freight under one agreement<\u002Fli>\n<li>Problems caught on the factory floor, not at your dock<\u002Fli>\n<li>A fully landed price per unit, quoted up front<\u002Fli>\n<\u002Ful>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n\n<section id=\"contact\" style=\"padding: 104px 0\">\n<div style=\"max-width: 1200px; margin: 0 auto; padding: 0 24px; display: flex; flex-wrap: wrap; gap: 56px\">\n<div style=\"flex: 1 1 360px; min-width: 0; display: flex; flex-direction: column; gap: 20px\">\n<p style=\"margin: 0; font-size: 14px; font-weight: 600; letter-spacing: 3px; text-transform: uppercase; color: #7E3E20\">Start a project<\u002Fp>\n<h2 style=\"margin: 0; font-size: clamp(30px, 3.6vw, 44px); line-height: 1.15; letter-spacing: -1px\">Tell us what you want on the shelf.<\u002Fh2>\n<p style=\"margin: 0; font-size: 18px; color: #4A5661\">Send a product idea, a competitor's item or a full spec sheet. We'll reply with factory options and a landed-cost estimate.<\u002Fp>\n<div style=\"display: flex; flex-direction: column; gap: 10px; padding-top: 8px; font-size: 16px\">\n<a href=\"mailto:racejgrinder@gmail.com\" style=\"font-weight: 600\">racejgrinder@gmail.com<\u002Fa>\n<a href=\"tel:+15135083238\" style=\"font-weight: 600\">+1 513 508 3238<\u002Fa>\n<span style=\"color: #4A5661\">WhatsApp and WeChat available<\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n<form aria-label=\"Quote request\" style=\"flex: 1 1 480px; min-width: 0; border: 1px solid #E2E5E8; border-radius: 16px; padding: 32px; box-sizing: border-box; display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 18px\">\n<div style=\"display: flex; flex-direction: column; gap: 6px\">\n<label for=\"q-name\" style=\"font-size: 14px; font-weight: 600\">Name<\u002Flabel>\n<input id=\"q-name\" type=\"text\" autocomplete=\"name\" style=\"min-height: 46px; padding: 0 14px; border: 1px solid #C3C9CE; border-radius: 8px; font: inherit; font-size: 15px\">\n<\u002Fdiv>\n<div style=\"display: flex; flex-direction: column; gap: 6px\">\n<label for=\"q-company\" style=\"font-size: 14px; font-weight: 600\">Company<\u002Flabel>\n<input id=\"q-company\" type=\"text\" autocomplete=\"organization\" style=\"min-height: 46px; padding: 0 14px; border: 1px solid #C3C9CE; border-radius: 8px; font: inherit; font-size: 15px\">\n<\u002Fdiv>\n<div style=\"display: flex; flex-direction: column; gap: 6px\">\n<label for=\"q-email\" style=\"font-size: 14px; font-weight: 600\">Work email<\u002Flabel>\n<input id=\"q-email\" type=\"email\" autocomplete=\"email\" style=\"min-height: 46px; padding: 0 14px; border: 1px solid #C3C9CE; border-radius: 8px; font: inherit; font-size: 15px\">\n<\u002Fdiv>\n<div style=\"display: flex; flex-direction: column; gap: 6px\">\n<label for=\"q-cat\" style=\"font-size: 14px; font-weight: 600\">Category<\u002Flabel>\n<select id=\"q-cat\" style=\"min-height: 46px; padding: 0 12px; border: 1px solid #C3C9CE; border-radius: 8px; font: inherit; font-size: 15px; background: #FFFFFF\">\n<option>Cookware<\u002Foption>\n<option>Bakeware<\u002Foption>\n<option>Tools &amp; gadgets<\u002Foption>\n<option>Food storage<\u002Foption>\n<option>Cutlery<\u002Foption>\n<option>Tabletop &amp; drinkware<\u002Foption>\n<option>Something else<\u002Foption>\n<\u002Fselect>\n<\u002Fdiv>\n<div style=\"display: flex; flex-direction: column; gap: 6px; grid-column: 1 / -1\">\n<label for=\"q-msg\" style=\"font-size: 14px; font-weight: 600\">What are you looking to make?<\u002Flabel>\n<textarea id=\"q-msg\" rows=\"5\" style=\"padding: 12px 14px; border: 1px solid #C3C9CE; border-radius: 8px; font: inherit; font-size: 15px; resize: vertical\"><\u002Ftextarea>\n<\u002Fdiv>\n<div style=\"grid-column: 1 / -1\">\n<button type=\"button\" style=\"min-height: 52px; padding: 0 28px; border: 0; border-radius: 8px; background: #A4532C; color: #FFFFFF; font: inherit; font-size: 16px; font-weight: 600; cursor: pointer\">Request a quote<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fform>\n<\u002Fdiv>\n<\u002Fsection>\n\n\n<footer style=\"background: #10191F; color: #AEB9C2\">\n<div style=\"max-width: 1200px; margin: 0 auto; padding: 56px 24px 40px; display: flex; flex-direction: column; gap: 32px\">\n<div style=\"display: flex; flex-wrap: wrap; justify-content: space-between; gap: 32px\">\n<div style=\"display: flex; align-items: center; gap: 14px\">\n<span style=\"width: 48px; height: 48px; border-radius: 10px; background: #FFFFFF; color: #17242E; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 700; letter-spacing: 1px\">ICF<\u002Fspan>\n<span style=\"display: flex; flex-direction: column; gap: 2px\">\n<span style=\"font-size: 17px; font-weight: 700; color: #FFFFFF; letter-spacing: 0.5px\">ICF Kitchen Goods<\u002Fspan>\n<span style=\"font-size: 13px; font-family: 'Noto Sans SC', 'Sora', sans-serif\">中美厨房用品贸易<\u002Fspan>\n<\u002Fspan>\n<\u002Fdiv>\n<nav aria-label=\"Footer\" style=\"display: flex; flex-wrap: wrap; gap: 12px 28px; font-size: 15px\">\n<a href=\"#services\" style=\"color: #DDE3E8; text-decoration: none\">Services<\u002Fa>\n<a href=\"#categories\" style=\"color: #DDE3E8; text-decoration: none\">Categories<\u002Fa>\n<a href=\"#process\" style=\"color: #DDE3E8; text-decoration: none\">How it works<\u002Fa>\n<a href=\"#contact\" style=\"color: #DDE3E8; text-decoration: none\">Contact<\u002Fa>\n<\u002Fnav>\n<\u002Fdiv>\n<div style=\"border-top: 1px solid #2A3741; padding-top: 24px; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px; font-size: 13px\">\n<span>© 2026 ICF Kitchen Goods. All rights reserved.<\u002Fspan>\n<span>Cincinnati, Ohio, USA<\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Ffooter>\n\n<\u002Fdiv>\n<\u002Fsc-if><\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;accent&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#A4532C&quot;,&quot;options&quot;:[&quot;#A4532C&quot;,&quot;#1F6F6B&quot;,&quot;#2B4C7E&quot;,&quot;#B5452C&quot;]},&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:5000}}\">\nclass Component extends DCLogic {\n  renderVals() {\n    return { accent: this.props.accent ?? '#A4532C' };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
